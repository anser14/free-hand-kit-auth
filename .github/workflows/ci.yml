name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / Django ${{ matrix.django_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            django: ">=5.2,<5.3"
            django_name: "5.2 LTS"
          - python: "3.12"
            django: ">=5.2,<5.3"
            django_name: "5.2 LTS"
          - python: "3.12"
            django: ">=6.0,<6.1"
            django_name: "6.0"
          - python: "3.13"
            django: ">=5.2,<5.3"
            django_name: "5.2 LTS"
          - python: "3.13"
            django: ">=6.0,<6.1"
            django_name: "6.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e ".[dev]" "Django${{ matrix.django }}"
      - run: python -m pytest -m "not real_services"

  quality-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e ".[dev]" pip-audit
      - run: python -m ruff format --check src tests
      - run: python -m ruff check src tests
      - run: python -m mypy src
      - run: python -m coverage run -m pytest -m "not real_services"
      - run: python -m coverage report
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip_audit --local --skip-editable

  real-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e ".[dev]"
      - run: docker compose -f compose.integration.yml up --detach --wait
      - run: python -m pytest -m real_services tests/integration/test_real_services.py
        env:
          FK_AUTH_TEST_POSTGRES: "1"
          FK_AUTH_TEST_REDIS_URL: redis://127.0.0.1:6379/15
          FK_AUTH_TEST_SMTP: "1"
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          EMAIL_HOST: 127.0.0.1
          EMAIL_PORT: "1025"
      - if: always()
        run: docker compose -f compose.integration.yml down --volumes
