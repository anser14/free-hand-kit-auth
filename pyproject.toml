[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "freehand-kit-auth"
version = "1.0.0"
description = "Configurable Django REST Framework authentication endpoints built on Simple JWT."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Freehand Kit contributors" },
]
keywords = ["django", "django-rest-framework", "authentication", "jwt", "drf", "openapi"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = [
  "Django>=5.2,<6.1",
  "djangorestframework>=3.17.2,<3.19",
  "djangorestframework-simplejwt>=5.5.1,<6",
  "drf-spectacular>=0.29,<1",
]

[project.optional-dependencies]
crypto = ["djangorestframework-simplejwt[crypto]>=5.5.1,<6"]
# Compatibility alias for configurations that previously used the narrower name.
rsa = ["djangorestframework-simplejwt[crypto]>=5.5.1,<6"]
redis = ["redis>=5,<7"]
dev = [
  "build>=1.2",
  "coverage[toml]>=7.6",
  "mypy>=1.13",
  "django-stubs[compatible-mypy]>=5.1",
  "djangorestframework-stubs>=3.15",
  "djangorestframework-simplejwt[crypto]>=5.5.1,<6",
  "pytest>=8.3",
  "pytest-django>=4.9",
  "pip-audit>=2.8",
  "psycopg[binary]>=3.2",
  "redis>=5,<7",
  "fakeredis>=2.26,<3",
  "ruff>=0.8",
  "twine>=6.0",
]

[project.urls]
Documentation = "https://github.com/anser14/free-hand-kit-auth#readme"
Issues = "https://github.com/anser14/free-hand-kit-auth/issues"
Source = "https://github.com/anser14/free-hand-kit-auth"
Changelog = "https://github.com/anser14/free-hand-kit-auth/blob/main/CHANGELOG.md"
Security = "https://github.com/anser14/free-hand-kit-auth/security/policy"

[tool.hatch.build.targets.wheel]
packages = ["src/fk_auth"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/examples",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/SECURITY.md",
  "/CONTRIBUTING.md",
  "/CODE_OF_CONDUCT.md",
  "/compose.integration.yml",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib"
markers = [
  "real_services: requires PostgreSQL, Redis, and Mailpit configured by the integration environment.",
]

[tool.coverage.run]
branch = true
source = ["fk_auth"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.django-stubs]
django_settings_module = "tests.settings"
