services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fk_auth_test
      POSTGRES_USER: fk_auth
      POSTGRES_PASSWORD: fk_auth
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fk_auth -d fk_auth_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - "1025:1025"
      - "8025:8025"
